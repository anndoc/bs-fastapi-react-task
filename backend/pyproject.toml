[project]
name = "bs-fastapi-react-task"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.2",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "sqlalchemy[asyncio]>=2.1.8",
    "sqlmodel>=0.0.49",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pre-commit>=4.3.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]


[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]


[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]


[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["."]

