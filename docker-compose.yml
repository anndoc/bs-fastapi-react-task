services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bs
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bs"]
      interval: 5s
      timeout: 5s
      retries: 10

  document-processor:
    image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    working_dir: /app
    command: sh -c "while true; do uv run python -m common.worker; sleep 600; done"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/bs
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./media:/media

  backend:
    image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    working_dir: /app
    command: sh -c "uv sync --frozen && uv run uvicorn common.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/bs
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - ./media:/media

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      API_URL: ${API_URL:-http://backend:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  frontend_node_modules:
